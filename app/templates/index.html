<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sports Risk AI</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="container">
    <header>
      <p class="eyebrow">RED NEURONAL · DEMO EDUCATIVA</p>
      <h1>Sports Risk AI</h1>
      <p class="subtitle">Estimación experimental de riesgo deportivo a partir de carga y recuperación.</p>
    </header>

    <section class="card">
      <form id="riskForm">
        <div class="grid">
          <label>Edad<input name="age" type="number" value="25" min="14" max="80" required></label>
          <label>Peso (kg)<input name="weight_kg" type="number" step="0.1" value="84" min="35" max="180" required></label>
          <label>Horas de entrenamiento/semana<input name="training_hours" type="number" step="0.1" value="8" min="0" max="30" required></label>
          <label>Días de entrenamiento/semana<input name="training_days" type="number" value="5" min="0" max="7" required></label>
          <label>Horas de sueño promedio<input name="sleep_hours" type="number" step="0.1" value="6" min="0" max="14" required></label>
          <label>Días de descanso/semana<input name="rest_days" type="number" value="1" min="0" max="7" required></label>
          <label>Intensidad (1-10)<input name="intensity" type="number" value="8" min="1" max="10" required></label>
          <label>Carga semanal<input name="weekly_load" type="number" value="850" min="0" max="3000" required></label>
          <label>Molestia/dolor percibido (0-10)<input name="pain" type="number" value="3" min="0" max="10" required></label>
          <label>Minutos de competición recientes<input name="competition_minutes" type="number" value="120" min="0" max="500" required></label>
        </div>
        <button type="submit">Analizar riesgo</button>
      </form>
    </section>

    <section id="result" class="result hidden">
      <div class="result-main">
        <span>RIESGO ESTIMADO</span>
        <strong id="risk">—</strong>
        <b id="probability">—</b>
      </div>
      <p id="message"></p>
      <div id="bars"></div>
      <small>Resultado experimental: no constituye diagnóstico ni predicción médica.</small>
    </section>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
